# 複製成 config.yaml 再修改：cp config.example.yaml config.yaml
timezone: Asia/Taipei

display:
  width: 128          # 必須和韌體 include/config.h 的面板尺寸一致
  height: 64
  page_seconds: 8     # 一般頁面停留秒數
  live_page_seconds: 12  # 比賽進行中的頁面停留秒數
  # fonts:            # 想換字型時再打開
  #   small: fonts/fusion-pixel-12px-proportional-zh_hant.otf
  #   large: /usr/share/fonts/opentype/unifont/unifont.otf

brightness:
  day: 160            # 0-255
  night: 30           # 夜間模式（有比賽進行中時仍用 day 亮度）
  night_start: "23:30"
  night_end: "07:00"

poll:
  live_seconds: 2     # 有比賽進行中：每 2 秒向資料來源更新一次比分
  screen_refresh_seconds: 2   # 畫面停在進行中的比賽時，看板每 2 秒重抓一次畫面（0 = 不重抓）
  soon_seconds: 60    # 30 分鐘內有比賽要開打
  idle_seconds: 600   # 其他時間

# teams 留空 [] = 該聯盟全部比賽都顯示（每一場都會輪播到）
# 可以填英文縮寫（MLB/NBA）或中文隊名關鍵字（台灣聯盟）
leagues:
  cpbl:
    enabled: true
    teams: []                 # 例：[中信, 味全]
    # rebas_seasons: [CPBL-2026-LU]   # 通常不用填：會自動從野球革命找出當天的賽季（例行賽、季後挑戰賽、台灣大賽）
  mlb:
    enabled: true
    teams: []                 # 例：[LAD, NYY] 道奇、洋基。縮寫見 scoreboard/teams.py
  nba:
    enabled: true
    teams: []                 # 例：[GSW, LAL] 勇士、湖人
  tpbl:
    enabled: true
    teams: []                 # 例：[國王, 戰神]
  plg:
    enabled: true
    teams: []

# 官方隊名 -> 你想顯示的短名（覆寫自動縮寫）
aliases: {}
#  臺北富邦勇士: 富邦

# 整點報時：用看板驅動板上的喇叭播放音檔（目前只有微雪 ESP32-S3-RGB-Matrix 有喇叭）
chime:
  enabled: false
  file: chime.mp3       # 音檔放在 server 資料夾（mp3、m4a、wav… 都可以，需要 ffmpeg）
  volume: 70            # 0-100
  max_seconds: 20       # 音檔太長時只播前面這幾秒
  weekday: [9, 20]      # 平日 09:00～20:00 每個整點
  weekend: [12, 20]     # 假日 12:00～20:00 每個整點
  holidays: []          # 國定假日照假日時段，例：["2026-10-10", "2027-01-01"]
  workdays: []          # 補班日照平日時段，例：["2026-12-26"]
