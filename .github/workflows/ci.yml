# 測試環境：GitHub 的機器可以正常上網，所以在這裡
#   1. 跑伺服器的單元測試、產生預覽圖
#   2. 連到五個聯盟的真實網站抓資料（probe），確認解析器能用
#   3. 編譯 ESP32 韌體（四種板子）
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: 伺服器測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安裝點陣中文字型
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei fonts-unifont
      - run: pip install -r requirements.txt
      - name: 單元測試
        run: python -m pytest -q
      - name: 用假資料產生預覽圖
        run: python -m scoreboard preview --demo --out preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-demo
          path: server/preview/

  probe:
    name: 真實資料來源檢查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei fonts-unifont
      - run: pip install -r requirements.txt
      - name: 抓今天、昨天與上週末（台灣時間）的比賽
        run: |
          python -m scoreboard probe --out probe/today --diagnose || true
          for d in $(TZ=Asia/Taipei date -d yesterday +%F) $(TZ=Asia/Taipei date -d 'last saturday' +%F) $(TZ=Asia/Taipei date -d 'last sunday' +%F); do
            echo "################ $d ################"
            python -m scoreboard probe --date "$d" --out "probe/$d" || true
          done
      - name: 用真實資料產生預覽圖
        run: python -m scoreboard preview --out preview-live || true
      - name: 印出原始回應（前 2500 字）
        if: always()
        run: |
          for f in probe/*/raw/*.txt; do
            echo "================ $f"
            head -c 2500 "$f"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            server/probe/
            server/preview-live/

  firmware:
    name: 韌體編譯 (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare_s3, trinity, esp32dev, matrixportal_s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: 編譯
        run: pio run -d firmware -e ${{ matrix.env }}
      - name: 韌體大小
        run: ls -la firmware/.pio/build/${{ matrix.env }}/firmware.bin
