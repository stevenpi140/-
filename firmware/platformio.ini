; 依你的控制板選一個 env：
;   pio run -e waveshare_s3 -t upload     （淘寶買得到：微雪 ESP32-S3-RGB-Matrix 驅動板）
;   pio run -e trinity -t upload          （ESP32 Trinity，直接插 HUB75 面板）
;   pio run -e esp32dev -t upload         （一般 ESP32 DevKit 自己接線，腳位同 Trinity）
;   pio run -e matrixportal_s3 -t upload  （Adafruit MatrixPortal S3；函式庫作者表示可能有 WiFi 干擾問題）
;
; 第一次一定要用 USB 燒錄；之後可以用 WiFi 無線更新（OTA），在 env 名稱後面加 _ota：
;   pio run -e waveshare_s3_ota -t upload

; ===== OTA 無線更新設定 =====
[ota]
; 無線更新密碼：請改成你自己的，改完要先用 USB 燒錄一次才會生效
password = scoreboard
; 看板在區網上的位址。scoreboard.local 不通時（常見於 Windows），改成看板開機時顯示的 IP
host = scoreboard.local

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
    adafruit/Adafruit GFX Library@1.11.11
    tzapu/WiFiManager@2.0.17
build_flags =
    '-DOTA_PASSWORD="${ota.password}"'

; 4MB Flash 的板子改用 min_spiffs 分割表：兩個 1.9MB 的程式區，OTA 才放得下新舊兩份韌體
[env:trinity]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DBOARD_GENERIC_ESP32

[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DBOARD_GENERIC_ESP32

[env:matrixportal_s3]
board = adafruit_matrixportal_esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_MATRIXPORTAL_S3

; 微雪 ESP32-S3-RGB-Matrix：模組是 ESP32-S3-WROOM-2-N32R16V（32MB Octal Flash + 16MB Octal PSRAM）
; USB 燒錄方式：按住 BOOT 再插 USB-C，放開 BOOT 後上傳，完成後按 RESET
[env:waveshare_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; ===== 無線更新用的 env（和上面的板子設定相同，只是改用 WiFi 上傳）=====
[ota_upload]
upload_protocol = espota
upload_port = ${ota.host}
upload_flags =
    --auth=${ota.password}

[env:waveshare_s3_ota]
extends = env:waveshare_s3, ota_upload

[env:trinity_ota]
extends = env:trinity, ota_upload

[env:esp32dev_ota]
extends = env:esp32dev, ota_upload

[env:matrixportal_s3_ota]
extends = env:matrixportal_s3, ota_upload
