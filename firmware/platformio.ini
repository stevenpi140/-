; 依你的控制板選一個 env：
;   pio run -e trinity -t upload          （推薦：ESP32 Trinity，直接插 HUB75 面板）
;   pio run -e esp32dev -t upload         （一般 ESP32 DevKit 自己接線，腳位同 Trinity）
;   pio run -e matrixportal_s3 -t upload  （Adafruit MatrixPortal S3；函式庫作者表示可能有 WiFi 干擾問題）

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
    adafruit/Adafruit GFX Library@1.11.11
    tzapu/WiFiManager@2.0.17

[env:trinity]
board = esp32dev
build_flags =
    -DBOARD_GENERIC_ESP32

[env:esp32dev]
board = esp32dev
build_flags =
    -DBOARD_GENERIC_ESP32

[env:matrixportal_s3]
board = adafruit_matrixportal_esp32s3
build_flags =
    -DBOARD_MATRIXPORTAL_S3
